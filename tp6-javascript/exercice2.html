<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Exercice 2</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background-color: #f5f5f5;
        text-align: center;
      }
      img {
        display: block;
        margin: 20px auto;
        border: 3px solid #007bff;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      button {
        margin: 10px 5px;
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #218838;
      }
      #info {
        margin-top: 20px;
        padding: 15px;
        background-color: #fff3cd;
        border-radius: 5px;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <img id="photo" src="https://picsum.photos/300/200" alt="Image aléatoire">
    <button id="btnVerifier">Vérifier l'attribut alt</button>
    <button id="btnModifier">Changer l'image</button>
    <p id="info"></p>
    <script>
      document.getElementById('btnVerifier').addEventListener('click', function() {
        const img = document.getElementById('photo');
        const info = document.getElementById('info');
        if (img.hasAttribute('alt')) {
          const altValue = img.getAttribute('alt');
          info.textContent = `Attribut alt présent : ${altValue}`;
        } else {
          info.textContent = 'Attribut alt absent, ajout en cours...';
          img.setAttribute('alt', 'Photo sans description');
        }
      });
      document.getElementById('btnModifier').addEventListener('click', function() {
        const img = document.getElementById('photo');
        const info = document.getElementById('info');
        img.setAttribute('src', 'https://picsum.photos/300/201');
        img.setAttribute('alt', 'Nouvelle image chargée');
        info.textContent = `src: ${img.getAttribute('src')} | alt: ${img.getAttribute('alt')}`;
      });
    </script>
  </body>
</html>
