</head>
<body>
    <script>
        let nom = null
let age = 0
let ville = ""
let score = undefined
let actif = false

// Partie A
let a1 = nom ?? "valeur par défaut"
console.log("nom ?? \"valeur par défaut\" -> " + a1)

let a2 = age ?? "valeur par défaut"
console.log("age ?? \"valeur par défaut\" -> " + a2)

let a3 = ville ?? "valeur par défaut"
console.log("ville ?? \"valeur par défaut\" -> " + a3)

let a4 = score ?? "valeur par défaut"
console.log("score ?? \"valeur par défaut\" -> " + a4)

let a5 = actif ?? "valeur par défaut"
console.log("actif ?? \"valeur par défaut\" -> " + a5)

console.log("-----")

// Partie B
let b1 = nom || "valeur par défaut"
console.log("nom || \"valeur par défaut\" -> " + b1)

let b2 = age || "valeur par défaut"
console.log("age || \"valeur par défaut\" -> " + b2)

let b3 = ville || "valeur par défaut"
console.log("ville || \"valeur par défaut\" -> " + b3)

let b4 = score || "valeur par défaut"
console.log("score || \"valeur par défaut\" -> " + b4)

let b5 = actif || "valeur par défaut"
console.log("actif || \"valeur par défaut\" -> " + b5)

console.log("-----")

// Partie C
console.log("nom : ?? et || -> " + (a1 === b1 ? "même résultat" : "résultat différent"))
console.log("age : ?? et || -> " + (a2 === b2 ? "même résultat" : "résultat différent"))
console.log("ville : ?? et || -> " + (a3 === b3 ? "même résultat" : "résultat différent"))
console.log("score : ?? et || -> " + (a4 === b4 ? "même résultat" : "résultat différent"))
console.log("actif : ?? et || -> " + (a5 === b5 ? "même résultat" : "résultat différent"))
    </script>
</body>
