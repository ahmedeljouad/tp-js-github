<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP - Manipulation du DOM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 id="titre-principal">Bienvenue sur la page TP</h1>

  <div id="container">
    <p>Paragraphe introductif hors bloc.</p>

    <div id="bloc">
      <span class="etiquette">Bloc principal</span>
      <p class="para">Paragraphe A dans le bloc</p>
      <p class="para">Paragraphe B dans le bloc</p>
      <p class="para emphase">Paragraphe C dans le bloc (emphase)</p>
    </div>

    <div id="zone-ajout">
      <hr>
      <h3>Ajouter des éléments :</h3>
      <input type="text" id="champ-texte" placeholder="Écrivez ici...">
      <button id="btn-ajouter">Ajouter à la liste</button>
      <ul id="ma-liste"></ul>
      <hr>
    </div>
  </div>
  <div id="controles">
    <button id="btn-action">Cliquez ici (Compteur)</button>
    <button id="btn-cacher">Cacher le bloc</button>
    <button id="btn-afficher">Afficher le bloc</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
