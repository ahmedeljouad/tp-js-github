<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Exercice 1</title>
</head>

<body>

<script>
let prenom = "Ali";
let age = 20;
let motDePasse = "12345678";
let confirmation = "12345678";
let pays = "France";

let erreurs = [];

if (prenom.length < 2) {
    erreurs.push("Le prénom doit contenir au moins 2 caractères.");
}


if (!Number.isInteger(age) || age < 13 || age > 120) {
    erreurs.push("L'âge doit être un entier entre 13 et 120.");
}


if (motDePasse.length < 8) {
    erreurs.push("Le mot de passe doit contenir au moins 8 caractères.");
}


if (motDePasse !== confirmation) {
    erreurs.push("La confirmation du mot de passe est incorrecte.");
}


let paysAutorises = ["France", "Belgique", "Suisse", "Canada"];

if (!paysAutorises.includes(pays)) {
    erreurs.push("Le pays n'est pas autorisé.");
}

if (erreurs.length === 0) {
    console.log("Compte créé avec succès.");
} else {
    console.log("Erreurs :");
    erreurs.forEach(e => console.log(e));
}

</script>

</body>
</html>
