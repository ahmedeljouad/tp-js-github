<body>
    <script>
    function estPremier(n) {
    if (n <= 1) {
        return false;
    }

    for (let i = 2; i < n; i++) {
        if (n % i === 0) {
            return false;
        }
    }

    return true;
}
// programme principal

let compteur = 0;

console.log("Nombres premiers entre 1 et 100 :");

for (let i = 1; i <= 100; i++) {

    if (estPremier(i)) {
        console.log(i);
        compteur++;
    }

}

console.log("Nombre total :", compteur);


// premier nombre premier supérieur à 500
let nombre = 501;

while (!estPremier(nombre)) {
    nombre++;
}

console.log("Premier nombre premier supérieur à 500 :", nombre);
    </script>
</body>
</html>
