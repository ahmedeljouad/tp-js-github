<body>

    <h1>Exercice 3</h1>

    <script>
        //  Déclaration de la constante
        const TAUX_TVA = 0.20;

        //  Déclaration de la variable
        let prixHT = 150;

        // 3. Calculs
        let montantTVA = TAUX_TVA * prixHT;
        let prixTTC = prixHT + montantTVA;

        //  Affichage dans la console
        console.log(`Prix HT : ${prixHT} € | TVA (20%) : ${montantTVA} € | Prix TTC : ${prixTTC} €`);

    </script>
