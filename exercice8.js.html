<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice8</title>
</head>
<body>
    <script>
    let nom = " Fatima "
let age = "23"
let email = "fatima@example"
let scoreJeu = "150pts"
let estAdmin = "false"
let derniereConnexion = null
let nombreConnexions = "0"

let nomCorrige = nom.trim()

if (nomCorrige === "") {
    nomCorrige = "Inconnu"
}

console.log("Nom :", nomCorrige)

let ageNombre = parseInt(age)
let ageStatut = ""

if (isNaN(ageNombre) || ageNombre <= 0) {
    ageStatut = "valeur invalide"
} else {
    ageStatut = ageNombre
}

console.log("Age :", ageStatut)

let emailStatut = "invalide"

let positionAt = email.indexOf("@")
let positionPoint = email.lastIndexOf(".")

if (positionAt !== -1 && positionPoint > positionAt) {
    emailStatut = "valide"
}

console.log("Email :", email, "->", emailStatut)

let score = parseInt(scoreJeu)

if (isNaN(score)) {
    score = 0
}

console.log("Score jeu :", score)

let adminBool = false

if (estAdmin === "true") {
    adminBool = true
} else if (estAdmin === "false") {
    adminBool = false
}

console.log("Est admin :", adminBool)

let connexion = derniereConnexion ?? "Jamais connecté"

console.log("Dernière connexion :", connexion)

let nbConnexions = Number(nombreConnexions)

if (nbConnexions === 0) {
    console.log("Connexions : Aucune connexion")
} else {
    console.log("Connexions :", nbConnexions)
}
    </script>
</body>
</html>
